# Site welcome de Group1 : fichiers statiques servis par nginx, aucune application derrière.
# Copie de référence de /etc/nginx/sites-available/welcome sur la VM.
server {
    listen 80;
    listen [::]:80;
    server_name welcome.group1.umons;

    # Seul le dossier site/ du dépôt est servi : .git, README et nginx/ restent hors d'atteinte.
    root /opt/welcome/site;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css image/svg+xml;

    # Pas de script ni de ressource externe : seuls nos styles et nos images sont autorisés.
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Site en lecture seule
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    error_page 404 /404.html;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location /static/ {
        expires 1h;
        access_log off;
    }

    # Fichiers cachés (.git, .env...) jamais servis
    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
